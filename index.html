<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula Central — Campus Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<!-- Supabase Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          ink:   { 950:'#0A0F1C', 900:'#0F1729', 800:'#17223A', 700:'#202D4A', 600:'#2B3B5E', 500:'#425179' },
          paper: { 50:'#FCFBF8', 100:'#F6F3EC', 200:'#EBE6D9', 300:'#DCD5C2' },
          gold:  { 400:'#D6A94E', 500:'#C08A28', 600:'#A6741E' },
          forest:{ 400:'#5B9C76', 500:'#3F7D58', 600:'#34674A' },
          steel: { 400:'#5B7CB0', 500:'#3B5B8C', 600:'#314C74' },
          brick: { 400:'#C96570', 500:'#B4404A', 600:'#973640' },
        },
        fontFamily: {
          serif: ['Lora', 'ui-serif', 'Georgia', 'serif'],
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
      }
    }
  }
</script>
</head>
<body class="font-sans bg-paper-100 text-ink-900 min-h-screen">

<!-- ======================= LOGIN VIEW ======================= -->
<div id="view-login" style="display: flex;" class="min-h-screen flex-col md:flex-row">
  <div class="relative md:w-1/2 bg-ink-900 text-paper-100 flex flex-col justify-between p-8 md:p-14">
    <div>
      <span class="font-serif text-lg tracking-tight text-white">Aula Central</span>
    </div>
    <div>
      <p class="font-serif text-4xl text-white mb-4">Todo el año escolar, en un solo lugar.</p>
      <p class="text-paper-300 text-sm">Plataforma educativa conectada.</p>
    </div>
  </div>

  <div class="md:w-1/2 flex items-center justify-center p-8 md:p-14 bg-white">
    <div class="w-full max-w-sm">
      <h1 class="font-serif text-2xl mb-1 text-ink-900">Iniciar Sesión</h1>
      <p class="text-sm text-gray-500 mb-6">Prueba de acceso directo.</p>

      <div class="space-y-4">
        <div>
          <label class="block text-sm mb-1 text-gray-700">Correo</label>
          <input id="login-email" type="email" value="j.a.proyect777@gmail.com"
            class="w-full px-3 py-2 rounded border border-gray-300 text-sm">
        </div>
        <div>
          <label class="block text-sm mb-1 text-gray-700">Contraseña</label>
          <input id="login-password" type="password" placeholder="Tu contraseña"
            class="w-full px-3 py-2 rounded border border-gray-300 text-sm">
        </div>
        <button type="button" onclick="probarAccesoTotal()" class="w-full py-2.5 rounded bg-ink-900 text-white text-sm font-medium hover:bg-black">
          Entrar Ahora
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ======================= APP VIEW ======================= -->
<div id="view-app" style="display: none;" class="min-h-screen p-8 bg-paper-100">
  <h1 class="font-serif text-3xl text-ink-900 mb-4">¡Bienvenido a tu Panel!</h1>
  <p class="text-sm text-gray-700 mb-6">Has entrado de forma exitosa a la plataforma.</p>
  <button onclick="location.reload()" class="px-4 py-2 bg-red-600 text-white text-sm rounded">Cerrar Sesión</button>
</div>

<script>
const SUPABASE_URL = 'https://kwvedzqzxkbfdnpsfbsni.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_A-79Dwa7yhLpFiJPGBJpWA_ZH8UuZ9a'; 

let supabaseClient;
try {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
} catch (err) {
  alert("Error crítico al iniciar Supabase: " + err.message);
}

async function probarAccesoTotal() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;

  if (!password) {
    alert("Por favor escribe tu contraseña.");
    return;
  }

  try {
    console.log("Enviando petición a Supabase...");
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    
    if (error) {
      alert("Error de autenticación: " + error.message);
      return;
    }

    console.log("¡Respuesta exitosa!", data);

    // Ocultar login y mostrar app usando estilos directos en línea (imposible de bloquear)
    document.getElementById('view-login').style.display = 'none';
    document.getElementById('view-app').style.display = 'block';

  } catch (err) {
    alert("Ocurrió un error inesperado en el script: " + err.message);
  }
}
</script>
</body>
</html>
