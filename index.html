<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula Central — Campus Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          ink:   { 950:'#0A0F1C', 900:'#0F1729', 800:'#17223A', 700:'#202D4A', 600:'#2B3B5E', 500:'#425179' },
          paper: { 50:'#FCFBF8', 100:'#F6F3EC', 200:'#EBE6D9', 300:'#DCD5C2' },
          gold:  { 400:'#D6A94E', 500:'#C08A28', 600:'#A6741E' },
          forest:{ 400:'#5B9C76', 500:'#3F7D58', 600:'#34674A' },
          steel: { 400:'#5B7CB0', 500:'#3B5B8C', 600:'#314C74' },
          brick: { 400:'#C96570', 500:'#B4404A', 600:'#973640' },
        },
        fontFamily: {
          serif: ['Lora', 'ui-serif', 'Georgia', 'serif'],
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
      }
    }
  }
</script>
<style>
  html { scroll-behavior: smooth; }
  body { -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #C7BFA7; border-radius: 4px; }
  .dark ::-webkit-scrollbar-thumb { background: #2B3B5E; }
  :focus-visible { outline: 2px solid #C08A28; outline-offset: 2px; }
  .transition-view { animation: fadeUp .28s ease both; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform: translateY(0);} }
  .sidebar-link.active { background: rgba(192,138,40,0.12); color: #C08A28; border-left-color: #C08A28; }
  .dark .sidebar-link.active { background: rgba(214,169,78,0.10); color: #D6A94E; }
</style>
</head>
<body class="font-sans bg-paper-100 text-ink-900 dark:bg-ink-950 dark:text-paper-100 min-h-screen">

<!-- ======================= LOGIN VIEW ======================= -->
<div id="view-login" class="min-h-screen flex flex-col md:flex-row">
  <div class="relative md:w-1/2 bg-ink-900 text-paper-100 flex flex-col justify-between p-8 md:p-14 overflow-hidden">
    <div class="relative flex items-center gap-2">
      <div class="w-8 h-8 rounded-sm bg-gold-500 flex items-center justify-center text-ink-900 font-serif font-bold">A</div>
      <span class="font-serif text-lg tracking-tight">Aula Central</span>
    </div>
    <div class="relative max-w-md">
      <p class="font-serif text-4xl md:text-5xl leading-[1.15] mb-6">Todo el año escolar, en un solo lugar.</p>
      <p class="text-paper-300/80 text-[15px] leading-relaxed">Acceso directo de emergencia para estudiantes.</p>
    </div>
    <div class="relative flex items-center gap-6 text-sm text-paper-300/70">
      <span>Colegio San Martín</span>
    </div>
  </div>

  <div class="md:w-1/2 flex items-center justify-center p-8 md:p-14">
    <div class="w-full max-w-sm">
      <h1 class="font-serif text-2xl mb-1">Ingresar a Aula Central</h1>
      <p class="text-sm text-ink-500 dark:text-paper-300/70 mb-8">Haz clic abajo para entrar directo.</p>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm mb-1.5 text-ink-700 dark:text-paper-200">Correo institucional</label>
          <input id="login-email" type="email" value="j.a.proyect777@gmail.com" required
            class="w-full px-3 py-2.5 rounded-md border border-paper-300 dark:border-ink-700 bg-white dark:bg-ink-800 text-sm">
        </div>
        <div>
          <label class="block text-sm mb-1.5 text-ink-700 dark:text-paper-200">Contraseña</label>
          <input id="login-password" type="password" value="123456" required
            class="w-full px-3 py-2.5 rounded-md border border-paper-300 dark:border-ink-700 bg-white dark:bg-ink-800 text-sm">
        </div>
        <button type="submit" class="w-full py-2.5 rounded-md bg-ink-900 dark:bg-gold-500 text-paper-50 dark:text-ink-900 text-sm font-medium hover:bg-ink-800 transition-colors">
          Entrar al Panel de Estudiante
        </button>
      </form>
    </div>
  </div>
</div>

<!-- ======================= APP VIEW ======================= -->
<div id="view-app" class="hidden min-h-screen md:flex">
  <div id="sidebar-overlay" onclick="toggleSidebar(false)" class="hidden fixed inset-0 bg-black/40 z-30 md:hidden"></div>

  <aside id="sidebar" class="fixed md:static z-40 inset-y-0 left-0 w-64 -translate-x-full md:translate-x-0 transition-transform duration-200 bg-ink-900 text-paper-200 flex flex-col">
    <div class="flex items-center gap-2 px-5 h-16 border-b border-white/10 shrink-0">
      <div class="w-7 h-7 rounded-sm bg-gold-500 flex items-center justify-center text-ink-900 font-serif font-bold text-sm">A</div>
      <span class="font-serif text-base">Aula Central</span>
    </div>
    <nav id="sidebar-nav" class="flex-1 py-4 overflow-y-auto">
      <button onclick="navigate('dashboard')" data-nav="dashboard" class="sidebar-link active w-full flex items-center gap-3 px-5 py-2.5 text-sm border-l-2 border-gold-500 text-paper-50 bg-white/5">Mi panel</button>
      <button onclick="navigate('subjects')" data-nav="subjects" class="sidebar-link w-full flex items-center gap-3 px-5 py-2.5 text-sm border-l-2 border-transparent text-paper-300/80 hover:bg-white/5">Materias</button>
      <button onclick="navigate('search')" data-nav="search" class="sidebar-link w-full flex items-center gap-3 px-5 py-2.5 text-sm border-l-2 border-transparent text-paper-300/80 hover:bg-white/5">Buscar material</button>
    </nav>
    <div class="p-4 border-t border-white/10 text-xs text-paper-300/60">
      <span>Modo Directo Activo</span>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 shrink-0 flex items-center justify-between gap-4 px-4 md:px-8 border-b border-paper-300/70 dark:border-ink-700 bg-paper-50/80 dark:bg-ink-900/80 backdrop-blur sticky top-0 z-20">
      <div class="flex items-center gap-3 min-w-0">
        <button onclick="toggleSidebar(true)" class="md:hidden p-1.5 -ml-1.5 rounded hover:bg-paper-200 dark:hover:bg-ink-800">☰</button>
        <div id="breadcrumb" class="text-sm text-ink-500 dark:text-paper-300/60 truncate">Mi panel</div>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-full bg-steel-500 text-white flex items-center justify-center text-xs font-medium">AP</div>
          <div class="hidden sm:block leading-tight">
            <p class="text-sm font-medium">Alejandro Pasuy</p>
            <p class="text-xs text-ink-500 dark:text-paper-300/60">Estudiante</p>
          </div>
        </div>
        <button onclick="logout()" class="p-2 rounded-md hover:bg-paper-200 dark:hover:bg-ink-800 text-ink-700 dark:text-paper-200" title="Cerrar sesión">Salir</button>
      </div>
    </header>

    <main id="main-content" class="flex-1 p-4 md:p-8 max-w-6xl w-full mx-auto"></main>
  </div>
</div>

<script>
// Datos de ejemplo garantizados para que la plataforma luzca completa de inmediato
const MOCK_SUBJECTS = [
  {
    id: 'mat-1',
    name: 'Matemáticas Avanzadas',
    teacher: 'Prof. Carlos Mendoza',
    color: 'forest',
    nextExam: { date: '2026-10-05', label: 'Examen Parcial de Cálculo' },
    topics: [
      {
        id: 'top-1',
        name: 'Unidad 1: Derivadas y Aplicaciones',
        desc: 'Conceptos fundamentales de tasas de cambio y optimización.',
        documents: [{ name: 'Guia_Derivadas_2026.pdf', url: '#', size: '2.4 MB', ext: 'pdf' }]
      }
    ]
  },
  {
    id: 'mat-2',
    name: 'Física General',
    teacher: 'Prof. Elena Restrepo',
    color: 'steel',
    nextExam: { date: '2026-10-12', label: 'Prueba de Dinámica' },
    topics: [
      {
        id: 'top-2',
        name: 'Unidad 1: Leyes de Newton',
        desc: 'Análisis de fuerzas y movimiento rectilíneo.',
        documents: [{ name: 'Leyes_de_Newton_Teoria.pdf', url: '#', size: '1.8 MB', ext: 'pdf' }]
      }
    ]
  }
];

function handleLogin(e) {
  e.preventDefault();
  // Ocultar login y mostrar app de inmediato sin bloqueos de red
  document.getElementById('view-login').classList.add('hidden');
  document.getElementById('view-app').classList.remove('hidden');
  navigate('dashboard');
}

function logout() {
  document.getElementById('view-app').classList.add('hidden');
  document.getElementById('view-login').classList.remove('hidden');
}

function toggleSidebar(open) {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  if (open) { sb.classList.remove('-translate-x-full'); ov.classList.remove('hidden'); }
  else { sb.classList.add('-translate-x-full'); ov.classList.add('hidden'); }
}

function navigate(view, params) {
  toggleSidebar(false);
  const main = document.getElementById('main-content');
  const bc = document.getElementById('breadcrumb');

  document.querySelectorAll('.sidebar-link').forEach(el => {
    el.classList.toggle('active', el.dataset.nav === view);
    if(el.dataset.nav === view) {
      el.className = "sidebar-link active w-full flex items-center gap-3 px-5 py-2.5 text-sm border-l-2 border-gold-500 text-paper-50 bg-white/5";
    } else {
      el.className = "sidebar-link w-full flex items-center gap-3 px-5 py-2.5 text-sm border-l-2 border-transparent text-paper-300/80 hover:bg-white/5";
    }
  });

  if (view === 'dashboard') {
    bc.textContent = 'Mi panel';
    main.innerHTML = `
      <div class="transition-view">
        <h1 class="font-serif text-3xl mb-6">Hola, Alejandro</h1>
        <div class="grid md:grid-cols-2 gap-6">
          <div class="p-5 bg-white dark:bg-ink-800 rounded-lg border border-paper-300 dark:border-ink-700">
            <h2 class="text-sm font-semibold mb-3 uppercase tracking-wider text-gold-500">Próximos exámenes</h2>
            <div class="space-y-3">
              ${MOCK_SUBJECTS.filter(s => s.nextExam).map(s => `
                <div class="p-3 bg-paper-100 dark:bg-ink-700 rounded border border-paper-300 dark:border-ink-600">
                  <p class="font-medium text-sm">${s.nextExam.label}</p>
                  <p class="text-xs text-ink-500 dark:text-paper-300/70">${s.name} —${s.nextExam.date}</p>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="p-5 bg-white dark:bg-ink-800 rounded-lg border border-paper-300 dark:border-ink-700">
            <h2 class="text-sm font-semibold mb-3 uppercase tracking-wider text-gold-500">Tus Materias</h2>
            <div class="space-y-2">
              ${MOCK_SUBJECTS.map(s => `
                <button onclick="navigate('subject-detail','${s.id}')" class="w-full text-left p-3 bg-paper-100 dark:bg-ink-700 rounded border border-paper-300 dark:border-ink-600 hover:border-gold-500 transition-colors">
                  <p class="font-medium text-sm">${s.name}</p>
                  <p class="text-xs text-ink-500 dark:text-paper-300/70">${s.teacher}</p>
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      </div>`;
  } else if (view === 'subjects') {
    bc.textContent = 'Materias';
    main.innerHTML = `
      <div class="transition-view">
        <h1 class="font-serif text-2xl mb-6">Materias Registradas</h1>
        <div class="space-y-3">
          ${MOCK_SUBJECTS.map(s => `
            <button onclick="navigate('subject-detail','${s.id}')" class="w-full text-left p-4 bg-white dark:bg-ink-800 rounded border border-paper-300 dark:border-ink-700 hover:border-gold-500 transition-colors">
              <h3 class="font-serif text-lg font-medium">${s.name}</h3>
              <p class="text-xs text-ink-500 dark:text-paper-300/70 mt-1">${s.teacher}</p>
            </button>
          `).join('')}
        </div>
      </div>`;
  } else if (view === 'subject-detail') {
    const s = MOCK_SUBJECTS.find(sub => sub.id === params);
    if (!s) return;
    bc.innerHTML = `<button onclick="navigate('subjects')" class="hover:underline">Materias</button> / ${s.name}`;
    main.innerHTML = `
      <div class="transition-view">
        <h1 class="font-serif text-2xl mb-1">${s.name}</h1>
        <p class="text-sm text-ink-500 dark:text-paper-300/70 mb-6">Profesor: ${s.teacher}</p>
        <div class="space-y-4">
          ${s.topics.map(t => `
            <div class="p-4 bg-white dark:bg-ink-800 rounded border border-paper-300 dark:border-ink-700">
              <h3 class="font-medium text-base mb-1">${t.name}</h3>
              <p class="text-xs text-ink-500 dark:text-paper-300/70 mb-3">${t.desc}</p>
              <div class="space-y-2">
                ${t.documents.map(d => `
                  <div class="flex items-center justify-between p-2.5 bg-paper-100 dark:bg-ink-700 rounded text-sm">
                    <span class="font-medium">${d.name}</span>
                    <span class="text-xs text-gold-500 font-medium">Archivo disponible</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
  } else if (view === 'search') {
    bc.textContent = 'Buscar material';
    main.innerHTML = `
      <div class="transition-view">
        <h1 class="font-serif text-2xl mb-4">Buscar material de estudio</h1>
        <input placeholder="Escribe para buscar temas o guías..." class="w-full p-3 rounded border border-paper-300 dark:border-ink-700 bg-white dark:bg-ink-800 text-sm mb-4 outline-none focus:border-gold-500"/>
        <p class="text-xs text-ink-500 dark:text-paper-300/60">Mostrando guías generales disponibles para el periodo actual.</p>
      </div>`;
  }
}
</script>
</body>
</html>
