<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula Central — Campus Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<!-- Supabase Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          ink:   { 950:'#0A0F1C', 900:'#0F1729', 800:'#17223A', 700:'#202D4A', 600:'#2B3B5E', 500:'#425179' },
          paper: { 50:'#FCFBF8', 100:'#F6F3EC', 200:'#EBE6D9', 300:'#DCD5C2' },
          gold:  { 400:'#D6A94E', 500:'#C08A28', 600:'#A6741E' },
          forest:{ 400:'#5B9C76', 500:'#3F7D58', 600:'#34674A' },
          steel: { 400:'#5B7CB0', 500:'#3B5B8C', 600:'#314C74' },
          brick: { 400:'#C96570', 500:'#B4404A', 600:'#973640' },
        },
        fontFamily: {
          serif: ['Lora', 'ui-serif', 'Georgia', 'serif'],
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
      }
    }
  }
</script>
<style>
  html { scroll-behavior: smooth; }
  body { -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #C7BFA7; border-radius: 4px; }
  .dark ::-webkit-scrollbar-thumb { background: #2B3B5E; }
  :focus-visible { outline: 2px solid #C08A28; outline-offset: 2px; }
  .transition-view { animation: fadeUp .28s ease both; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform: translateY(0);} }
  .sidebar-link.active { background: rgba(192,138,40,0.12); color: #C08A28; border-left-color: #C08A28; }
  .dark .sidebar-link.active { background: rgba(214,169,78,0.10); color: #D6A94E; }
</style>
</head>
<body class="font-sans bg-paper-100 text-ink-900 dark:bg-ink-950 dark:text-paper-100 min-h-screen">

<!-- ======================= LOGIN VIEW ======================= -->
<div id="view-login" class="min-h-screen flex flex-col md:flex-row">
  <div class="relative md:w-1/2 bg-ink-900 text-paper-100 flex flex-col justify-between p-8 md:p-14 overflow-hidden">
    <div class="relative flex items-center gap-2">
      <div class="w-8 h-8 rounded-sm bg-gold-500 flex items-center justify-center text-ink-900 font-serif font-bold">A</div>
      <span class="font-serif text-lg tracking-tight">Aula Central</span>
    </div>
    <div class="relative max-w-md">
      <p class="font-serif text-4xl md:text-5xl leading-[1.15] mb-6">Todo el año escolar, en un solo lugar.</p>
      <p class="text-paper-300/80 text-[15px] leading-relaxed">
        Materias, evaluaciones y material de estudio conectados para estudiantes y profesores de tu colegio.
      </p>
    </div>
    <div class="relative flex items-center gap-6 text-sm text-paper-300/70">
      <span>Colegio San Martín</span>
      <span class="w-1 h-1 rounded-full bg-paper-300/40"></span>
      <span>Año lectivo 2026</span>
    </div>
  </div>

  <div class="md:w-1/2 flex items-center justify-center p-8 md:p-14">
    <div class="w-full max-w-sm">
      <h1 class="font-serif text-2xl mb-1">Ingresar a Aula Central</h1>
      <p class="text-sm text-ink-500 dark:text-paper-300/70 mb-8">Usa tus credenciales de Supabase para continuar.</p>

      <div class="space-y-4">
        <div>
          <label class="block text-sm mb-1.5 text-ink-700 dark:text-paper-200">Correo institucional</label>
          <input id="login-email" type="email" required placeholder="nombre.apellido@colegio.edu"
            class="w-full px-3 py-2.5 rounded-md border border-paper-300 dark:border-ink-700 bg-white dark:bg-ink-800 text-sm">
        </div>
        <div>
          <label class="block text-sm mb-1.5 text-ink-700 dark:text-paper-200">Contraseña</label>
          <input id="login-password" type="password" required placeholder="••••••••"
            class="w-full px-3 py-2.5 rounded-md border border-paper-300 dark:border-ink-700 bg-white dark:bg-ink-800 text-sm">
        </div>
        <button type="button" onclick="handleLoginSafe()" class="w-full py-2.5 rounded-md bg-ink-900 dark:bg-gold-500 text-paper-50 dark:text-ink-900 text-sm font-medium hover:bg-ink-800 transition-colors">
          Iniciar sesión
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ======================= APP VIEW ======================= -->
<div id="view-app" class="hidden min-h-screen md:flex">
  <aside id="sidebar" class="w-64 bg-ink-900 text-paper-200 flex flex-col">
    <div class="flex items-center gap-2 px-5 h-16 border-b border-white/10 shrink-0">
      <div class="w-7 h-7 rounded-sm bg-gold-500 flex items-center justify-center text-ink-900 font-serif font-bold text-sm">A</div>
      <span class="font-serif text-base">Aula Central</span>
    </div>
    <nav id="sidebar-nav" class="flex-1 py-4">
      <button onclick="navigate('dashboard')" data-nav="dashboard" class="sidebar-link active w-full flex items-center gap-3 px-5 py-2.5 text-sm border-l-2 border-gold-500 text-paper-50 bg-white/5">Mi panel</button>
      <button onclick="navigate('subjects')" data-nav="subjects" class="sidebar-link w-full flex items-center gap-3 px-5 py-2.5 text-sm border-l-2 border-transparent text-paper-300/80 hover:bg-white/5">Materias</button>
      <button onclick="navigate('search')" data-nav="search" class="sidebar-link w-full flex items-center gap-3 px-5 py-2.5 text-sm border-l-2 border-transparent text-paper-300/80 hover:bg-white/5">Buscar material</button>
    </nav>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 shrink-0 flex items-center justify-between px-8 border-b border-paper-300 dark:border-ink-700 bg-paper-50 dark:bg-ink-900">
      <div id="breadcrumb" class="text-sm font-medium">Mi panel</div>
      <button onclick="logout()" class="px-3 py-1.5 rounded bg-brick-500 text-white text-xs font-medium hover:bg-brick-600 transition-colors">Cerrar sesión</button>
    </header>
    <main id="main-content" class="flex-1 p-8 max-w-6xl w-full mx-auto"></main>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://kwvedzqzxkbfdnpsfbsni.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_A-79Dwa7yhLpFiJPGBJpWA_ZH8UuZ9a'; 
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let SUBJECTS = [];

async function handleLoginSafe() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;

  if (!email || !password) {
    alert('Por favor ingresa tu correo y contraseña.');
    return;
  }

  // Intentar login con Supabase
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  
  if (error) {
    alert('Error al iniciar sesión: ' + error.message);
    return;
  }

  // CAMBIO DE VISTA INMEDIATO (Garantizado sin bloqueos)
  document.getElementById('view-login').classList.add('hidden');
  document.getElementById('view-app').classList.remove('hidden');
  
  navigate('dashboard');

  // Cargar materias de forma segura después de entrar
  try {
    const { data: subjectsData } = await supabase.from('subjects').select('*, topics(*, documents(*))');
    if (subjectsData) {
      SUBJECTS = subjectsData.map(s => ({
        id: s.id,
        name: s.name,
        teacher: s.teacher_name,
        color: s.color || 'forest',
        progress: s.progress || 50,
        nextExam: s.next_exam_date ? { date: s.next_exam_date, label: s.next_exam_label } : null,
        topics: (s.topics || []).map(t => ({
          id: t.id,
          name: t.name,
          desc: t.description,
          documents: (t.documents || []).map(d => ({ name: d.name, url: d.file_url, size: d.file_size, ext: d.file_ext }))
        }))
      }));
      navigate('dashboard'); // Refrescar panel con datos reales
    }
  } catch (err) {
    console.log("Aviso de carga de materias secundarias:", err);
  }
}

function logout() {
  supabase.auth.signOut();
  document.getElementById('view-app').classList.add('hidden');
  document.getElementById('view-login').classList.remove('hidden');
}

function navigate(view, params) {
  const main = document.getElementById('main-content');
  const bc = document.getElementById('breadcrumb');

  document.querySelectorAll('.sidebar-link').forEach(el => {
    const isActive = el.dataset.nav === view;
    el.className = isActive 
      ? "sidebar-link active w-full flex items-center gap-3 px-5 py-2.5 text-sm border-l-2 border-gold-500 text-paper-50 bg-white/5"
      : "sidebar-link w-full flex items-center gap-3 px-5 py-2.5 text-sm border-l-2 border-transparent text-paper-300/80 hover:bg-white/5";
  });

  if (view === 'dashboard') {
    bc.textContent = 'Mi panel';
    main.innerHTML = `
      <div class="transition-view">
        <h1 class="font-serif text-3xl mb-6">Panel Principal</h1>
        <div class="grid md:grid-cols-2 gap-6">
          <div class="p-5 bg-white dark:bg-ink-800 rounded-lg border border-paper-300 dark:border-ink-700">
            <h2 class="text-sm font-semibold mb-3 text-gold-500 uppercase">Tus Materias</h2>
            <div class="space-y-2">
              ${SUBJECTS.length > 0 ? SUBJECTS.map(s => `
                <button onclick="navigate('subject-detail','${s.id}')" class="w-full text-left p-3 bg-paper-100 dark:bg-ink-700 rounded border border-paper-300 dark:border-ink-600 hover:border-gold-500 transition-colors">
                  <p class="font-medium text-sm">${s.name}</p>
                  <p class="text-xs text-ink-500 dark:text-paper-300/70">${s.teacher}</p>
                </button>
              `).join('') : '<p class="text-sm text-ink-500">Cargando materias desde la base de datos...</p>'}
            </div>
          </div>
        </div>
      </div>`;
  } else if (view === 'subjects') {
    bc.textContent = 'Materias';
    main.innerHTML = `
      <div class="transition-view">
        <h1 class="font-serif text-2xl mb-6">Materias</h1>
        <div class="space-y-3">
          ${SUBJECTS.map(s => `
            <button onclick="navigate('subject-detail','${s.id}')" class="w-full text-left p-4 bg-white dark:bg-ink-800 rounded border border-paper-300 dark:border-ink-700 hover:border-gold-500">
              <h3 class="font-serif text-lg font-medium">${s.name}</h3>
              <p class="text-xs text-ink-500 dark:text-paper-300/70 mt-1">${s.teacher}</p>
            </button>
          `).join('') || '<p class="text-sm">Sin materias cargadas.</p>'}
        </div>
      </div>`;
  } else if (view === 'subject-detail') {
    const s = SUBJECTS.find(sub => sub.id === params);
    if (!s) return;
    bc.innerHTML = `<button onclick="navigate('subjects')" class="hover:underline">Materias</button> / ${s.name}`;
    main.innerHTML = `
      <div class="transition-view">
        <h1 class="font-serif text-2xl mb-1">${s.name}</h1>
        <p class="text-sm text-ink-500 dark:text-paper-300/70 mb-6">Profesor: ${s.teacher}</p>
        <div class="space-y-4">
          ${s.topics.map(t => `
            <div class="p-4 bg-white dark:bg-ink-800 rounded border border-paper-300 dark:border-ink-700">
              <h3 class="font-medium text-base mb-1">${t.name}</h3>
              <p class="text-xs text-ink-500 dark:text-paper-300/70 mb-3">${t.desc}</p>
              <div class="space-y-2">
                ${t.documents.map(d => `
                  <div class="flex items-center justify-between p-2.5 bg-paper-100 dark:bg-ink-700 rounded text-sm">
                    <span class="font-medium">${d.name}</span>
                    <a href="${d.url}" target="_blank" class="px-3 py-1 bg-gold-500 text-ink-900 rounded text-xs font-medium">Descargar</a>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
  } else if (view === 'search') {
    bc.textContent = 'Buscar material';
    main.innerHTML = `<div class="transition-view"><h1 class="font-serif text-2xl mb-4">Buscar material</h1><input placeholder="Buscar..." class="w-full p-3 rounded border border-paper-300 dark:border-ink-700 bg-white dark:bg-ink-800 text-sm"/></div>`;
  }
}
</script>
</body>
</html>
